site_name: Physics Notes
site_description: From QFT calculations to the research frontier — study and research notes
site_url: https://leeshep.github.io/
repo_url: https://github.com/LeeSHEP/LeeSHEP.github.io
repo_name: LeeSHEP.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs          # top tabs = big categories
    - navigation.sections
    - navigation.indexes       # a folder's index.md becomes the section landing page
    - toc.integrate            # page outline goes in the left sidebar (no right column)
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false                  # use the system font (fast, very readable)

plugins:
  - search:
      lang: en
  - tags
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:       # LaTeX math ($...$, $$...$$)
      generic: true
  - pymdownx.emoji:            # icons like :material-atom:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details           # collapsible blocks (??? note)
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

# Sidebar / top-tab order. Add new pages here.
# Top tabs = big categories; nested lists = subcategories in the sidebar.
nav:
  - Home: index.md
  - Studying:
      - studying/index.md
      # Foundations (studying/foundations/) and Advanced Topics (studying/advanced/)
      # are hidden until they have real pages — add them back here then.
      - QFT:
          - studying/qft/index.md
          - Canonical Quantization: studying/qft/01-canonical-quantization.md
      - Calculations:
          - studying/calculations/index.md
          - Scalar Theories:
              - φ⁴ Theory: studying/calculations/phi4.md
              - φ³ Theory: studying/calculations/phi3.md
          - Gauge Theories:
              - QED: studying/calculations/qed.md
              - QCD: studying/calculations/qcd.md
  - Research:
      - research/index.md
      # Paper Notes (research/papers/) and Projects (research/projects/)
      # are hidden until they have real pages — add them back here then.
  - Blog:
      - blog/index.md
  - About: about.md
