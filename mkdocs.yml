site_name: Physics Notes
site_description: From QFT calculations to the research frontier — study and research notes
site_url: https://leeshep.github.io/
repo_url: https://github.com/LeeSHEP/LeeSHEP.github.io
repo_name: LeeSHEP.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs          # top tabs: Foundations / QFT / Advanced / Research
    - navigation.sections
    - navigation.indexes       # a folder's index.md becomes the section landing page
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: en
  - tags
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:       # LaTeX math ($...$, $$...$$)
      generic: true
  - pymdownx.emoji:            # icons like :material-atom:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details           # collapsible blocks (??? note)
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

# Sidebar / top-tab order. Add new pages here.
# Top tabs = big categories; nested lists = subcategories in the sidebar.
nav:
  - Home: index.md
  - Studying:
      - studying/index.md
      - Foundations:
          - studying/foundations/index.md
      - QFT:
          - studying/qft/index.md
          - Canonical Quantization: studying/qft/01-canonical-quantization.md
      - Advanced Topics:
          - studying/advanced/index.md
  - Calculations:
      - calculations/index.md
      - QFT:
          - calculations/qft/index.md
          - φ⁴ Theory: calculations/qft/phi4.md
          - φ³ Theory: calculations/qft/phi3.md
          - QED: calculations/qft/qed.md
          - QCD: calculations/qft/qcd.md
  - Research:
      - research/index.md
      - Paper Notes: research/papers/index.md
      - Projects: research/projects/index.md
  - Blog:
      - blog/index.md
  - About: about.md
